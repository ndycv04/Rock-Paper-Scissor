<!DOCTYPE html>
<html>
  <head>
    <title>Rock-Paper-Scissor</title>
  </head>
  <body>
    <script>
        for (i = 0; i<5; i++){
            function getComputerChoice(){
                const choices = ["Rock", "Paper", "Scissor"];
                const random = Math.floor(Math.random() * choices.length); 
                console.log("Computer choice: " + choices[random]);
                return choices[random];
            }

            function getHumanChoice(){
                let human = prompt("Enter Rock, Paper, or Scissor: ")
                console.log("Human choice: " + human);
                return human;
            }
        
            const humanChoice = getHumanChoice();
            const computerChoice = getComputerChoice();

            humanScore = 0;
            computerScore = 0;

            function playRound(humanChoice,computerChoice){
                if (humanChoice === "Rock" && computerChoice === "Scissor" || humanChoice === "Scissor" && computerChoice === "Paper" || humanChoice === "Paper" && computerChoice === "Rock"){
                    console.log("Human wins this round!");
                    humanScore++;
                }
                else if (computerChoice === "Rock" && humanChoice === "Scissor" || humanChoice === "Scissor" && humanChoice === "Paper" || computerChoice === "Paper" && humanChoice === "Rock"){
                    console.log("Computer wins this round!");
                    computerScore++;
                }
                else{
                    console.log("It's a tie!");
                }
            }
            playRound(humanChoice, computerChoice);
        }

        console.log("Final score: Human: " + humanScore + ", Computer: " + computerScore);
        

        
    </script>
  </body>
</html>
